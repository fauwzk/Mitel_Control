services:
  mitel-control:
    build: .
    image: mitel-control:latest
    container_name: mitel-control
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Définir APP_PASSWORD dans .env}
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
      # Mettre à 1 derrière un reverse proxy HTTPS
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TZ: Europe/Paris
    ports:
      - "8067:8000"
    volumes:
      - mitel-data:/data
    # "Auto-Fetch MAC" (ARP) ne fonctionne que sur le même réseau L2 que les téléphones :
    # remplacer la section "ports" par la ligne suivante (hôte Linux uniquement).
    # network_mode: host

volumes:
  mitel-data:
