<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mitel Config Manager — Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<form class="panel login-box" method="post" action="/login">
    <h2>Mitel Config Manager</h2>
    <label>Password <input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <p class="error" id="login-error" hidden>Wrong password.</p>
    <button type="submit" class="primary block">Sign in</button>
</form>
<script>
    if (new URLSearchParams(location.search).has("error")) document.getElementById("login-error").hidden = false;
</script>
</body>
</html>
